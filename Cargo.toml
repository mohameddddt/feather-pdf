[package]
name = "featherpdf"
version = "0.1.0"
edition = "2024"
description = "A fast PDF reader for Windows that stays light on memory."
license = "MIT"
repository = "https://github.com/mohameddddt/feather-pdf"
readme = "README.md"

[dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
